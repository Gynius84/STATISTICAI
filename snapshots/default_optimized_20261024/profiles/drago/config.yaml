  protect_first_n: 3
  protect_last_n: 20
  target_ratio: 0.2
  threshold: 0.85
context:
  engine: compressor
cron:
  catch_up_missed: true
database:
  journal_mode: wal
delegation:
  max_iterations: 250
display:
  background_process_notifications: concise
  bell_on_complete: false
  bell_on_prompt: false
